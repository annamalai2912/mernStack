<!DOCTYPE html>
<html>
<head>
  <title>Simple React Demo</title>
  <!-- Load React & Babel from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">

  <!-- The single root container -->
  <div id="root"></div>

  <!-- React Code -->
  <script type="text/babel">
    const { useState } = React;

    // 1. Component with PROPS (Receives data from parent)
    function Greeting({ name }) {
      return <h2>Hello, {name}!</h2>;
    }

    // 2. Main App with STATE (Memory) and a LIST
    function App() {
      // Memory (State)
      const [count, setCount] = useState(0);

      // List of skills
      const skills = ["HTML", "CSS", "JavaScript", "React"];

      return (
        <div>
          {/* Using the component with a prop */}
          <Greeting name="Student" />

          {/* Button that updates state */}
          <button onClick={() => setCount(count + 1)}>
            Clicks: {count}
          </button>

          {/* Rendering a list using .map() and key */}
          <h3>My Skills:</h3>
          <ul>
            {skills.map((skill) => (
              <li key={skill}>{skill}</li>
            ))}
          </ul>
        </div>
      );
    }

    // Mount React into the #root div
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

</body>
</html>
