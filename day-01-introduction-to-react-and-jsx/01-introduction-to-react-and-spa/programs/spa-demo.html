<!DOCTYPE html>
<html>
<head>
  <title>Simple SPA Demo</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Single Page Application (SPA) Demo</h2>
  <p>Click buttons to change the view without reloading the page:</p>

  <button onclick="showHome()">Home</button>
  <button onclick="showProfile()">Profile</button>
  <button onclick="showCourses()">Courses</button>

  <div id="root" style="margin-top: 15px; padding: 15px; border: 1px solid #ccc; max-width: 400px;">
    <h3>Home View</h3>
    <p>Welcome to the Student Portal!</p>
  </div>

  <script>
    function showHome() {
      document.getElementById("root").innerHTML = "<h3>Home View</h3><p>Welcome to the Student Portal!</p>";
    }

    function showProfile() {
      document.getElementById("root").innerHTML = "<h3>Profile View</h3><p>Name: Alex | Dept: CSE</p>";
    }

    function showCourses() {
      document.getElementById("root").innerHTML = "<h3>Courses View</h3><p>Enrolled: React & Web Tech</p>";
    }
  </script>
</body>
</html>
