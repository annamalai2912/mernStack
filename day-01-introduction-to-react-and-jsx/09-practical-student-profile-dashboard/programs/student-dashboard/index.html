<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile Dashboard - Complete Practical Demo</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; padding: 30px; margin: 0; }
    .dashboard-card { max-width: 680px; margin: 0 auto; background: #ffffff; border-radius: 12px; border: 1px solid #cbd5e1; padding: 28px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.07); }
    .profile-header { display: flex; align-items: center; gap: 20px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; }
    .avatar { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid #2563eb; }
    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 12px; }
    .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; text-align: center; }
    .skills-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .skill-pill { background: #e0f2fe; color: #0369a1; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; }
    .contact-links { display: flex; gap: 10px; margin-top: 24px; padding-top: 18px; border-top: 1px solid #e2e8f0; flex-wrap: wrap; }
    .contact-btn { text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #ffffff; display: inline-flex; align-items: center; gap: 6px; }
    .btn-email { background: #2563eb; }
    .btn-github { background: #0f172a; }
    .btn-linkedin { background: #0284c7; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const studentData = {
      profile: {
        name: "Alex Morgan",
        rollNo: "CS-2024-042",
        department: "Computer Science & Engineering",
        institution: "Institute of Technology & Engineering",
        batch: "2022 - 2026",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=250&q=80",
        bio: "Passionate about Frontend development, React ecosystem, and building responsive web applications."
      },
      academics: {
        cgpa: 8.85,
        attendance: 92,
        isPlacementEligible: true,
        standingArrears: 0,
        semester: "Semester 6"
      },
      skills: [
        "React.js",
        "JavaScript (ES6+)",
        "HTML5 & CSS3",
        "Node.js Basics",
        "Git & GitHub",
        "Tailwind CSS"
      ],
      contact: {
        email: "alex.morgan@campus.edu",
        github: "https://github.com/alex-morgan",
        linkedin: "https://linkedin.com/in/alex-morgan"
      }
    };

    function ProfileHeader({ profile }) {
      return (
        <div className="profile-header">
          <img src={profile.avatar} alt={profile.name} className="avatar" />
          <div>
            <h2 style={{ margin: '0 0 4px 0', color: '#0f172a' }}>{profile.name}</h2>
            <p style={{ margin: '0 0 4px 0', color: '#64748b', fontSize: '14px' }}>
              Roll No: <strong>{profile.rollNo}</strong> | {profile.department}
            </p>
            <p style={{ margin: '0 0 6px 0', color: '#1e40af', fontSize: '13px', fontWeight: '500' }}>
              {profile.institution} ({profile.batch})
            </p>
            <p style={{ margin: 0, color: '#475569', fontSize: '13px', fontStyle: 'italic' }}>
              "{profile.bio}"
            </p>
          </div>
        </div>
      );
    }

    function AcademicStats({ academics }) {
      const isEligible = academics.attendance >= 75;

      return (
        <div style={{ marginTop: '22px' }}>
          <h3 style={{ margin: '0 0 4px 0', color: '#1e293b' }}>Academic Standing ({academics.semester})</h3>
          <div className="grid-stats">
            <div className="stat-box">
              <p style={{ margin: '0 0 4px 0', fontSize: '12px', color: '#64748b' }}>CGPA</p>
              <p style={{ margin: 0, fontSize: '20px', fontWeight: 'bold', color: '#16a34a' }}>{academics.cgpa} / 10</p>
            </div>
            <div className="stat-box">
              <p style={{ margin: '0 0 4px 0', fontSize: '12px', color: '#64748b' }}>Attendance</p>
              <p style={{ margin: 0, fontSize: '20px', fontWeight: 'bold', color: isEligible ? '#2563eb' : '#dc2626' }}>
                {academics.attendance}%
              </p>
            </div>
            <div className="stat-box">
              <p style={{ margin: '0 0 4px 0', fontSize: '12px', color: '#64748b' }}>Exam Status</p>
              <span style={{
                display: 'inline-block',
                marginTop: '2px',
                padding: '3px 8px',
                borderRadius: '4px',
                fontSize: '11px',
                fontWeight: 'bold',
                background: isEligible ? '#dcfce7' : '#fee2e2',
                color: isEligible ? '#15803d' : '#991b1b'
              }}>
                {isEligible ? "ELIGIBLE" : "SHORTAGE"}
              </span>
            </div>
            <div className="stat-box">
              <p style={{ margin: '0 0 4px 0', fontSize: '12px', color: '#64748b' }}>Placements</p>
              <p style={{ margin: 0, fontSize: '14px', fontWeight: 'bold', color: '#d97706' }}>
                {academics.isPlacementEligible ? "Registered ⭐" : "Pending"}
              </p>
            </div>
          </div>
        </div>
      );
    }

    function SkillsSection({ skills }) {
      return (
        <div style={{ marginTop: '22px' }}>
          <h3 style={{ margin: '0 0 8px 0', color: '#1e293b' }}>Technical Skills ({skills.length})</h3>
          <div className="skills-container">
            {skills.map(skill => (
              <span key={skill} className="skill-pill">{skill}</span>
            ))}
          </div>
        </div>
      );
    }

    function ContactFooter({ contact }) {
      return (
        <div className="contact-links">
          <a href={`mailto:${contact.email}`} className="contact-btn btn-email">📧 Email Student</a>
          <a href={contact.github} target="_blank" className="contact-btn btn-github">🐙 GitHub</a>
          <a href={contact.linkedin} target="_blank" className="contact-btn btn-linkedin">💼 LinkedIn</a>
        </div>
      );
    }

    function Dashboard() {
      return (
        <div className="dashboard-card">
          <ProfileHeader profile={studentData.profile} />
          <AcademicStats academics={studentData.academics} />
          <SkillsSection skills={studentData.skills} />
          <ContactFooter contact={studentData.contact} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
