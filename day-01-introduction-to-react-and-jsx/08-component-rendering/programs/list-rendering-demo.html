<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Rendering & Dynamic Keys Demo</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; padding: 30px; }
    .container { max-width: 800px; margin: 0 auto; background: #ffffff; border-radius: 10px; border: 1px solid #cbd5e1; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06); }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
    th { background: #f1f5f9; padding: 12px; text-align: left; font-weight: 600; color: #334155; border-bottom: 2px solid #cbd5e1; }
    td { padding: 12px; border-bottom: 1px solid #e2e8f0; color: #1e293b; }
    .skill-badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 4px; font-weight: 500; }
    .cgpa-pill { font-weight: bold; color: #15803d; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const studentList = [
      { id: "CS-101", name: "Aarav Kumar", dept: "CSE", cgpa: 8.9, skills: ["React", "JavaScript"] },
      { id: "IT-102", name: "Fatima Syed", dept: "IT", cgpa: 9.3, skills: ["React", "Python"] },
      { id: "EC-103", name: "Karthik Raj", dept: "ECE", cgpa: 7.8, skills: ["Embedded C", "C++"] },
      { id: "AI-104", name: "Nourin Banu", dept: "AIDS", cgpa: 9.1, skills: ["React", "Machine Learning"] }
    ];

    function StudentTable() {
      return (
        <div className="container">
          <h2 style={{ color: '#0f172a', margin: '0 0 6px 0' }}>Dynamic Student Directory</h2>
          <p style={{ color: '#64748b', margin: 0, fontSize: '13px' }}>
            Rendered using <code>array.map()</code> with unique <code>key</code> props.
          </p>

          <table>
            <thead>
              <tr>
                <th>Roll No</th>
                <th>Student Name</th>
                <th>Department</th>
                <th>CGPA</th>
                <th>Skills</th>
              </tr>
            </thead>
            <tbody>
              {studentList.map((student) => (
                <tr key={student.id}>
                  <td>{student.id}</td>
                  <td><strong>{student.name}</strong></td>
                  <td>{student.dept}</td>
                  <td className="cgpa-pill">{student.cgpa}</td>
                  <td>
                    {student.skills.map(skill => (
                      <span key={skill} className="skill-badge">{skill}</span>
                    ))}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudentTable />);
  </script>
</body>
</html>
