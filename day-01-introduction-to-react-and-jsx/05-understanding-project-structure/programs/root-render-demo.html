<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Root Mounting Demonstration</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; padding: 30px; }
    .box { max-width: 560px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { color: #1e40af; font-size: 22px; }
    p { color: #475569; line-height: 1.6; margin-top: 8px; }
    .code-box { background: #0f172a; color: #38bdf8; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; margin-top: 14px; }
  </style>
</head>
<body>

  <!-- In index.html, this is the single hook point where the whole React app mounts -->
  <div id="root"></div>

  <script type="text/babel">
    function CampusRootApp() {
      return (
        <div className="box">
          <h1>Campus Student Portal</h1>
          <p>
            This page demonstrates the core mounting architecture: <strong>index.html</strong> provides the blank <code>&lt;div id="root"&gt;</code>, and React attaches its entire component tree directly to it.
          </p>
          <div className="code-box">
            const root = ReactDOM.createRoot(document.getElementById('root'));<br/>
            root.render(&lt;CampusRootApp /&gt;);
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<CampusRootApp />);
  </script>
</body>
</html>
