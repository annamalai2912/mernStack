<!DOCTYPE html>
<html>
<head>
  <title>Simple Vanilla JS Counter</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">

  <!-- HTML: The elements on screen -->
  <h2>Vanilla JS Counter</h2>
  <h1 id="countText">0</h1>
  <button id="btn">+ Click Me</button>

  <!-- JAVASCRIPT: Manually finding and updating the element -->
  <script>
    let count = 0;
    const countText = document.getElementById("countText");
    const btn = document.getElementById("btn");

    btn.addEventListener("click", function() {
      count = count + 1;
      countText.innerText = count; // Manual DOM update
    });
  </script>

</body>
</html>
